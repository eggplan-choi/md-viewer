name: Auto Update Manifest

on:
  push:
    paths:
      - 'chapters/**'   # chapters 폴더 내 파일 변경 시에만 실행
    branches:
      - main           # 기본 브랜치명 (master인 경우 변경 필요)

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 저장소 자동 커밋을 위한 쓰기 권한
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: manifest.json 생성
        run: python generate_manifest.py

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json 변경 사항 없음"
          else
            git commit -m "docs: manifest.json 자동 갱신 [skip ci]"
            git push
          fi
